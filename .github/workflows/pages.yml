name: Deploy Gish Chat frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare website
        run: |
          mkdir -p _site

          if [ -f "public/index.html" ]; then
            echo "Using public/ as website root"
            cp -R public/. _site/
          elif [ -f "index.html" ]; then
            echo "Using repository root as website root"
            cp -R . _site/
            rm -rf _site/.git
            rm -rf _site/.github
            rm -rf _site/node_modules
            rm -rf _site/server
          else
            echo "ERROR: index.html not found"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Website files:"
          find _site -maxdepth 2 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
 
